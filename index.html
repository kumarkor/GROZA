<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Private Storage</title>
  <style>
    /* Dark Mode UI */
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #ffffff; margin: 0; padding: 20px; }
    .hidden { display: none !important; }
    
    /* Login Screen */
    #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; }
    #login-screen input { padding: 12px; margin-bottom: 15px; border-radius: 8px; border: none; width: 250px; text-align: center; font-size: 16px; }
    #login-screen button { padding: 12px 25px; background: #ff4757; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold;}
    
    /* App UI */
    .header { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);}
    .upload-section input { color: white; }
    .upload-section button { padding: 10px 20px; background: #1e90ff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;}
    
    .telegram-section { background: #1e1e1e; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; box-shadow: 0 4px 6px rgba(0,0,0,0.3);}
    .telegram-section input { padding: 10px; border-radius: 6px; border: none; flex: 1; min-width: 200px;}
    
    /* Gallery */
    #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
    .media-card { background: #1e1e1e; padding: 10px; border-radius: 10px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3);}
    .media-card img, .media-card video { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
    .send-tg-btn { margin-top: 10px; padding: 8px 15px; background: #2ed573; color: white; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold;}
    
    #status-msg { color: #2ed573; text-align: center; }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen">
    <h2>🔒 Secure Storage</h2>
    <input type="password" id="pass-input" placeholder="Enter Password">
    <button id="login-btn">Login</button>
  </div>

  <!-- MAIN APPLICATION -->
  <div id="app-screen" class="hidden">
    
    <div class="header">
      <h2>📁 My Storage</h2>
      <div class="upload-section">
        <input type="file" id="file-input" accept="image/*,video/*">
        <button id="upload-btn">Upload</button>
      </div>
    </div>
    
    <div class="telegram-section">
      <h3 style="width: 100%; margin-top: 0;">Telegram Bot Setup</h3>
      <input type="text" id="bot-token" placeholder="Bot Token (e.g. 123456:ABC-DEF...)">
      <input type="text" id="chat-id" placeholder="Your Chat ID (e.g. 123456789)">
    </div>

    <h4 id="status-msg"></h4>
    
    <div id="gallery">
      <!-- Media will load here -->
    </div>

  </div>

  <!-- Firebase Scripts as Modules -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getStorage, ref, uploadBytesResumable, getDownloadURL, listAll } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-storage.js";

    // Your Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDCO6Dpj9hcVgTCS-TFpFahxKp51AHF8hY",
      authDomain: "kumarkor-bbe2b.firebaseapp.com",
      projectId: "kumarkor-bbe2b",
      storageBucket: "kumarkor-bbe2b.firebasestorage.app",
      messagingSenderId: "487415479255",
      appId: "1:487415479255:web:d878b725c51e4dbc4e2992"
    };

    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);

    // --- Authentication Logic ---
    const SECRET_PASS = "10077361766";
    const urlParams = new URLSearchParams(window.location.search);
    
    // Check for Direct Link Password
    if (urlParams.get("pass") === SECRET_PASS) {
      showApp();
    }

    document.getElementById("login-btn").addEventListener("click", () => {
      if(document.getElementById("pass-input").value === SECRET_PASS) showApp();
      else alert("Wrong Password!");
    });

    function showApp() {
      document.getElementById("login-screen").classList.add("hidden");
      document.getElementById("app-screen").classList.remove("hidden");
      loadGallery();
    }

    // --- Firebase Upload Logic ---
    document.getElementById("upload-btn").addEventListener("click", () => {
      const file = document.getElementById("file-input").files[0];
      if (!file) return alert("Please select a file first!");

      const statusMsg = document.getElementById("status-msg");
      const storageRef = ref(storage, 'uploads/' + new Date().getTime() + '_' + file.name);
      const uploadTask = uploadBytesResumable(storageRef, file);

      uploadTask.on('state_changed', 
        (snapshot) => {
          const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
          statusMsg.innerText = 'Uploading: ' + Math.round(progress) + '%';
        }, 
        (error) => { console.error(error); statusMsg.innerText = "Upload failed!"; }, 
        () => {
          statusMsg.innerText = "Upload Complete!";
          setTimeout(() => statusMsg.innerText = "", 3000);
          loadGallery(); // Refresh gallery
        }
      );
    });

    // --- Firebase Gallery Logic ---
    async function loadGallery() {
      const gallery = document.getElementById("gallery");
      gallery.innerHTML = "<p>Loading files...</p>";
      const listRef = ref(storage, 'uploads/');
      
      try {
        const res = await listAll(listRef);
        gallery.innerHTML = "";
        
        if(res.items.length === 0) gallery.innerHTML = "<p>No files found.</p>";

        res.items.forEach(async (itemRef) => {
          const url = await getDownloadURL(itemRef);
          const isVideo = itemRef.name.match(/\.(mp4|webm|ogg)$/i);
          
          const card = document.createElement("div");
          card.className = "media-card";
          
          let mediaElement = isVideo 
            ? `<video src="${url}" controls></video>` 
            : `<img src="${url}" loading="lazy" />`;
            
          card.innerHTML = `
            ${mediaElement}
            <button class="send-tg-btn" onclick="sendToTelegram('${url}')">Send to Telegram</button>
          `;
          gallery.appendChild(card);
        });
      } catch (error) {
        gallery.innerHTML = "<p style='color:red;'>Error: Allow Read/Write access in Firebase Storage Rules.</p>";
        console.error(error);
      }
    }

    // --- Telegram Logic ---
    window.sendToTelegram = function(fileUrl) {
      const token = document.getElementById("bot-token").value;
      const chatId = document.getElementById("chat-id").value;
      
      if(!token || !chatId) return alert("Pahile Bot Token aani Chat ID taka!");

      // Use sendDocument to handle both images and videos easily
      const url = `https://api.telegram.org/bot${token}/sendDocument`;
      
      fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: chatId, document: fileUrl })
      })
      .then(res => res.json())
      .then(data => {
        if(data.ok) alert("File Sent to Telegram! ✅");
        else alert("Failed! Check Bot Token and Chat ID.");
      })
      .catch(err => alert("Error: " + err.message));
    }
  </script>
</body>
</html>
